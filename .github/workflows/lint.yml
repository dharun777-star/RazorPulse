name: Code Quality & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate JSON Schemas
        run: |
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('schemas/*.json')]; print('Schemas Valid!')"
